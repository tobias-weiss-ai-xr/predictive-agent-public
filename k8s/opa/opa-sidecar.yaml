apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: openedusuite-predictive-agent
  labels:
    app: opa
    component: policies
data:
  # Pod Security Policies
  pod_policies.rego: |
    # Pod Security Policies for predictive-agent
    package predictive_agent.pod

    # Deny pods with privilege escalation
    violation[msg] {
        input.kind.kind == "Pod"
        input.kind.spec.containers[_].securityContext.allowPrivilegeEscalation == true
        msg := sprintf("Pod %s has allowPrivilegeEscalation enabled", [input.kind.metadata.name])
    }

    # Deny pods running as root
    violation[msg] {
        input.kind.kind == "Pod"
        not input.kind.spec.securityContext.runAsNonRoot == true
        msg := sprintf("Pod %s is not configured to run as non-root", [input.kind.metadata.name])
    }

    # Deny pods with hostPath volumes
    violation[msg] {
        input.kind.kind == "Pod"
        input.kind.spec.volumes[_].hostPath != null
        msg := sprintf("Pod %s uses hostPath volumes", [input.kind.metadata.name])
    }

    # Allow only specific pod states for reconciliation
    valid_pod_state {
        pod_state := {
            "Running",
            "Pending", 
            "Succeeded",
            "Failed"
        }
        count(pod_state) == 4
    }

    # Risk scoring for pods
    pod_risk_score = score {
        score := 0
        
        # High risk: privilege escalation
        score += 100 if { input.kind.spec.containers[_].securityContext.allowPrivilegeEscalation == true }
        
        # High risk: running as root
        score += 100 if { not input.kind.spec.securityContext.runAsNonRoot == true }
        
        # Medium risk: hostPath volumes
        score += 50 if { input.kind.spec.volumes[_].hostPath != null }
        
        # Medium risk: hostNetwork
        score += 50 if { input.kind.spec.hostNetwork == true }
        
        # Low risk: no resource limits
        score += 20 if { not input.kind.spec.containers[_].resources.limits.memory }
        
        # Low risk: no resource limits
        score += 20 if { not input.kind.spec.containers[_].resources.limits.cpu }
        
        score <= 240
    }

    # Final decision
    default allow = false

    allow {
        not violation[_]
        pod_risk_score <= 50
    }

  # LLM Usage Policies
  llm_policies.rego: |
    # LLM Usage Policies for predictive-agent
    package predictive_agent.llm

    # Approved LLM models
    allowed_models = {
        "mistral-7b-latest",
        "llama-3-8b-instruct", 
        "gpt-4",
        "gpt-3.5-turbo"
    }

    # Deny unapproved models
    violation[msg] {
        input.model != null
        not allowed_models[input.model]
        msg := sprintf("LLM model %s is not in approved list", [input.model])
    }

    # Cost control
    violation[msg] {
        input.cost_per_request > 0.10
        msg := sprintf("Request cost $%f exceeds maximum of $0.10", [input.cost_per_request])
    }

    # Token limit
    violation[msg] {
        token_cost := input.prompt_tokens + input.max_tokens
        token_cost > 100000
        msg := sprintf("Request token count %d exceeds maximum of 100000", [token_cost])
    }

    # Final decision
    default allow_llm = false

    allow_llm {
        not violation[_]
        allowed_models[input.model]
        input.cost_per_request <= 0.10
        (input.prompt_tokens + input.max_tokens) <= 100000
    }

  # Cache Configuration Policies
  cache_policies.rego: |
    # Cache Management Policies for predictive-agent
    package predictive_agent.cache

    # Maximum cache sizes
    max_cache_sizes = {
        "pod_state": 10000,
        "prediction": 5000,
        "kubectl": 50000,
        "llm_prompt": 10000
    }

    # Maximum TTL values
    max_ttl_values = {
        "pod_state": 300,
        "prediction": 600,
        "kubectl": 60,
        "llm_prompt": 3600
    }

    # Minimum TTL values
    min_ttl_values = {
        "pod_state": 5,
        "prediction": 10,
        "kubectl": 5,
        "llm_prompt": 60
    }

    # Validate cache configuration
    violation[msg] {
        cache_config := input.cache_config
        layer := cache_config.layer
        size := cache_config.size
        max_size := max_cache_sizes[layer]
        size > max_size
        msg := sprintf("Cache layer %s size %d exceeds maximum of %d", [layer, size, max_size])
    }

    violation[msg] {
        cache_config := input.cache_config
        layer := cache_config.layer
        ttl := cache_config.ttl
        max_ttl := max_ttl_values[layer]
        ttl > max_ttl
        msg := sprintf("Cache layer %s TTL %d exceeds maximum of %d", [layer, ttl, max_ttl])
    }

    violation[msg] {
        cache_config := input.cache_config
        layer := cache_config.layer
        ttl := cache_config.ttl
        min_ttl := min_ttl_values[layer]
        ttl < min_ttl
        msg := sprintf("Cache layer %s TTL %d is below minimum of %d", [layer, ttl, min_ttl])
    }

    # Final decision
    default allow_cache_action = false

    allow_cache_action {
        not violation[_]
        input.action != "set"  # Allow reads even when disabled
    }

    allow_cache_action {
        input.action == "get"
    }

  # Main OPA Configuration
  config.yaml: |
    {
      "services": {
        "local": {
          "url": "http://localhost:8181"
        }
      },
      "server": {
        "addr": ":8181",
        "local_addr": "127.0.0.1:8181"
      },
      "log_level": "info",
      "log_format": "json",
      "telemetry": {
        "enabled": false
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: openedusuite-predictive-agent
  labels:
    app: opa
    component: config
data:
  config.yaml: |
    {
      "services": {
        "local": {
          "url": "http://localhost:8181"
        }
      },
      "server": {
        "addr": ":8181",
        "local_addr": "127.0.0.1:8181",
        
        # Authentication (CRITICAL for production)
        "authentication": {
          "type": "tls",
          "tls": {
            "cert_file": "/certs/server.crt",
            "private_key_file": "/certs/server.key",
            "ca_cert_file": "/certs/ca.crt"
          }
        },
        
        # Authorization
        "authorization": {
          "type": "basic",
          "basic": {
            "realm": "OPA"
          }
        },
        
        # TLS Configuration (CRITICAL)
        "tls_config": {
          "min_version": "1.3",
          "cipher_suites": [
            "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
            "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
            "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
            "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
          ]
        },
        
        # Security Headers
        "headers": {
          "content-security-policy": "default-src 'self'",
          "x-content-type-options": "nosniff",
          "x-frame-options": "DENY",
          "x-xss-protection": "1; mode=block"
        },
        
        # Telemetry (CRITICAL - Disable for air-gapped)
        "telemetry": {
          "enabled": false
        },
        
        # Audit Logging (CRITICAL)
        "audit_logging": {
          "enabled": true,
          "file": "/var/log/opa/audit.log",
          "level": "info",
          "format": "json"
        },
        
        # Bundle Configuration
        "bundle_server": {
          "enabled": true,
          "resource": "bundles/policies.tar.gz",
          "polling": {
            "min_delay_seconds": 60,
            "max_delay_seconds": 120
          }
        }
      },
      
      "log_level": "info",
      "log_format": "json"
    }
  
  # Authentication credentials (empty - will be mounted from Secret)
  authz_credentials.yaml: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: opa-tls-certs
  namespace: openedusuite-predictive-agent
  labels:
    app: opa
    component: tls
type: kubernetes.io/tls
data:
  # These should be populated with actual certificates
  # ca.crt: <base64-encoded-CA-certificate>
  # server.crt: <base64-encoded-server-certificate>
  # server.key: <base64-encoded-server-private-key>
  # Use: kubectl create secret tls opa-tls-certs --cert=server.crt --key=server.key
  ca.crt: ""
  server.crt: ""
  server.key: ""
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: openedusuite-predictive-agent
  labels:
    app: opa
    component: server
spec:
  selector:
    app: opa
    component: server
  ports:
  - name: https
    port: 443
    targetPort: 8181
    protocol: TCP
  - name: http
    port: 80
    targetPort: 8181
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: openedusuite-predictive-agent
  labels:
    app: opa
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
      component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: opa
        component: server
      annotations:
        checksum/config: "{{ include (print "k8s/opa/opa-sidecar.yaml") | fromYaml | toJson | sha256sum }}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        appArmorProfile:
          type: RuntimeDefault
        noNewPrivs: true
      
      serviceAccountName: default
      
      containers:
      - name: opa
        image: openpolicyagent/opa:latest
        imagePullPolicy: Always
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
        
        ports:
        - containerPort: 8181
          name: http
          protocol: TCP
        
        args:
        - "run"
        - "--server"
        - "--config-file=/config/config.yaml"
        - "--log-level=info"
        - "--log-format=json"
        
        env:
        - name: OPA_CONFIG_FILE
          value: "/config/config.yaml"
        
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8181
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8181
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        volumeMounts:
        - name: opa-config
          mountPath: /config
          readOnly: true
        - name: opa-policies
          mountPath: /policies
          readOnly: true
        - name: opa-certs
          mountPath: /certs
          readOnly: true
        - name: opa-logs
          mountPath: /var/log/opa
      
      volumes:
      - name: opa-config
        configMap:
          name: opa-config
      - name: opa-policies
        configMap:
          name: opa-policies
      - name: opa-certs
        secret:
          name: opa-tls-certs
      - name: opa-logs
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: openedusuite-predictive-agent
  labels:
    app: opa
    component: server
spec:
  replicas: 2  # For HA, use 2+ replicas
  selector:
    matchLabels:
      app: opa
      component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: opa
        component: server
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: opa
                  component: server
              topologyKey: "kubernetes.io/hostname"
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        noNewPrivs: true
      
      containers:
      - name: opa
        image: openpolicyagent/opa:latest
        imagePullPolicy: Always
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        
        ports:
        - containerPort: 8181
          name: http
          protocol: TCP
        
        args:
        - "run"
        - "--server"
        - "--config-file=/config/config.yaml"
        - "--log-level=info"
        
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8181
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8181
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        
        volumeMounts:
        - name: opa-config
          mountPath: /config
          readOnly: true
        - name: opa-policies
          mountPath: /policies
          readOnly: true
      
      volumes:
      - name: opa-config
        configMap:
          name: opa-config
      - name: opa-policies
        configMap:
          name: opa-policies
